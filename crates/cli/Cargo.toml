[package]
name = "brarchive-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
readme = "../../README.md"
description = "CLI for Bedrock Archives in Rust"
keywords = ["archive", "minecraft", "bedrock", "cli"]
categories = ["data-structures", "parser-implementations", "command-line-utilities"]

# The package is `brarchive-cli` (the plain `brarchive` name is the library), but
# `cargo install brarchive-cli` puts a binary called `brarchive` on your PATH.
[[bin]]
name = "brarchive"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
brarchive = { workspace = true }
serde_json = { version = "1.0", features = ["preserve_order"] }
log = "0.4"
fern = { version = "0.7", features = ["colored"] }
chrono = "0.4"
humantime = "2.1"
